name: Quality checks

on:
  workflow_call:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v4

    - uses: actions/setup-node@v3
      with:
        node-version: 24
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build types
      run: npm run build-types

    - name: Build UI
      run: npm -w ui run build

    - name: Type check
      run: npm run check-types

    - name: Init .env
      run: ./node_modules/.bin/df-dev init-env # local bin only: a bare npx would fetch an unrelated "df-dev" from the registry if the dependency were missing

    - name: Use localhost as DEV_HOST in CI
      run: sed -i 's/^DEV_HOST=.*/DEV_HOST=localhost/' .env

    # the core services only, like a developer's default env: no test needs an optional one
    - name: Start docker compose services
      run: docker compose up -d --wait

    - name: Start mock OIDC servers
      run: |
        mkdir -p dev/logs
        ./node_modules/.bin/dotenv -- node dev/mock-oidc-server.ts > dev/logs/mock-oidc.log 2>&1 &

    - name: Start dev API
      run: NODE_CONFIG=$(./node_modules/.bin/df-dev absent-config) ./node_modules/.bin/dotenv -- npm -w api run dev > dev/logs/api.log 2>&1 &

    - name: Wait for the dev API and mock OIDC servers to be ready
      run: |
        set -a; source .env; set +a
        for i in {1..30}; do
          if curl -sf "http://localhost:${DEV_API_PORT}/api/test-env/ping" >/dev/null \
            && curl -sf "http://localhost:$((MOCK_OIDC_PORT1 + 100))/_test/ping" >/dev/null \
            && curl -sf "http://localhost:$((MOCK_OIDC_PORT2 + 100))/_test/ping" >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "dev API or mock OIDC servers did not become ready" >&2
        tail -n 50 dev/logs/*.log
        exit 1

    - name: Run unit tests
      run: npm run test-unit

    - name: Run API tests
      run: npm run test-api

    - name: Run in-process tests
      run: npm run test-inproc

    - name: Audit
      run: npm audit --omit=dev --audit-level=critical

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          test-results/
          dev/logs/
        retention-days: 7

    - name: Docker compose logs on failure
      if: failure()
      run: docker compose --profile '*' logs

    - name: Stop docker compose services
      if: always()
      run: docker compose --profile '*' down
