<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  fontconfig of the docker image (FONTCONFIG_FILE, cf Dockerfile): the runtime ships no
  system font, so libvips renders the initials avatars with the Nunito file of this
  directory. Dev machines use their own fontconfig and need Nunito installed.
-->
<fontconfig>
  <dir>/app/api/resources/nunito-ttf</dir>
  <cachedir>/tmp/fontconfig</cachedir>
</fontconfig>
