<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  fontconfig of the initials avatars, pinned by api/src/avatars/render.ts (FONTCONFIG_FILE):
  the only font is the Nunito file of this directory, so libvips renders the avatars the
  same in dev, in the tests and in the docker image, which ships no system font.
-->
<fontconfig>
  <dir prefix="relative">nunito-ttf</dir>
  <cachedir>/tmp/fontconfig</cachedir>
</fontconfig>
